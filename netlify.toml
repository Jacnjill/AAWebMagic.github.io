# GitHub Pages keeps inquiry.html as a meta refresh. On Netlify, redirect it.
[[redirects]]
  from = "/inquiry.html"
  to = "/enquiry.html"
  status = 301
  force = true

# Deploy previews and branch deploys stay noindex even after the site-wide block below is removed.
[[context.deploy-preview.headers]]
  for = "/*"

  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"

  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /topdeals opens the deals page. That page sends people to packages until a deal is showable.
[[redirects]]
  from = "/topdeals"
  to = "/topDeals.html"
  status = 200

[[redirects]]
  from = "/topdeals.html"
  to = "/topDeals.html"
  status = 200


